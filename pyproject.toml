[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-bot"
version = "0.3.0"
description = "Official Hyperliquid HTTP+WS HIP-3 bot for EntropyIO (io:ANTH, io:SNDK)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "entropy-bot" }]
dependencies = [
    "hyperliquid-python-sdk>=0.18.0",
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
    "msgpack>=1.0.0",
    "requests>=2.32.0",
    "websocket-client>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
entropy-bot = "entropy_bot.cli:main"

[tool.setuptools.packages.find]
include = ["entropy_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 只查会导致错误的问题（pyflakes + 语法），不强制代码风格。
select = ["E9", "F"]
